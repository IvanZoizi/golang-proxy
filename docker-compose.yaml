services:
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: unless-stopped
    mem_limit: 256m
    mem_reservation: 128m
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_BRUTE_FORCE_LOGIN_PROTECTION: "false"
      GF_AUTH_LOGIN_MAXIMUM_INACTIVE_LIFETIME_DURATION: "7d"
      GF_AUTH_LOGIN_MAXIMUM_LIFETIME_DURATION: "30d"
      GF_AUTH_BASIC_ENABLED: "true"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./config/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      app_network:
        ipv4_address: 172.25.0.13

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    expose:
      - "9090"
    networks:
      app_network:
        ipv4_address: 172.25.0.12
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:9090/-/healthy || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5

  proxy:
    build: .
    container_name: proxy
    restart: unless-stopped
    mem_limit: 512m
    mem_reservation: 256m
    ports:
      - "8080:8080"
    depends_on:
      prometheus:
        condition: service_healthy
    networks:
      app_network:
        ipv4_address: 172.25.0.11

    # === Важные монтирования ===
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json:ro          # конфиг
      - ./logs:/app/logs                           # логи (чтобы не терялись при перезапуске)
      - ./config:/app/config:ro


    # Рабочая директория (важно!)
    working_dir: /app

networks:
  app_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  grafana_data:
  prometheus_data: